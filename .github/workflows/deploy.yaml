name: Deploy Website
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-slim
    environment:
      name: Production
      url: https://${{ vars.DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy
        run: |
          # 1. Setup local SSH environment safely
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 2. Add target domain to known_hosts to prevent stalling
          ssh-keyscan -p ${{ vars.SERVER_SSH_PORT }} ${{ vars.DOMAIN }} >> ~/.ssh/known_hosts

          # 3. Stream data using rsync (preserves commit metadata)
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.SERVER_SSH_PORT }}" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ vars.DOMAIN }}:/srv/www/${{ vars.DOMAIN }}/main
